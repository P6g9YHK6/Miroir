plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miroir'
    compileSdk 36

    defaultConfig {
        applicationId "com.miroir"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "2.0"
        resConfigs "en"
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile     file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix   "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            // Both of these embed build-environment-derived data into the APK
            // (git metadata, ART startup-profile bytes), which breaks
            // byte-for-byte reproducible builds since they're not guaranteed
            // to come out identical between build machines.
            vcsInfo {
                include = false
            }
            // Ensure deterministic output for reproducible builds
            // Disable R8 optimizations that may produce non-deterministic output
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Force deterministic resource compilation
    aaptOptions {
        cruncherEnabled = false
    }

    // Ensure deterministic Java compilation
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-g:none" // No debug info for reproducibility
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        disable 'HardcodedText', 'SetTextI18n'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.zxing:core:3.5.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'

    // Workaround for bcprov-jdk18on 1.85 compiled with Java 25 (class version 69)
    // which is incompatible with Java 21. Force older version.
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

configurations.all {
    resolutionStrategy {
        force 'org.bouncycastle:bcprov-jdk18on:1.86'
    }
}

// ART baseline profile bytes aren't guaranteed reproducible across build
// machines; this app has no measured startup-performance need for them.
tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}